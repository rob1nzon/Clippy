name: Build Clippy EXE

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release version, e.g. v0.2.0 (leave empty for build only)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Test model connection logic
        run: dotnet run --project tests/Clippy.ConnectionTests -c Release
      - name: Publish portable Windows x64 app
        run: >-
          msbuild Clippy\Clippy.csproj /restore /t:Publish
          /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64
          /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=false
          /p:PublishDir=${{ github.workspace }}\artifacts\Clippy-win-x64\
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/Clippy-win-x64/Clippy.exe)) { throw "Clippy.exe was not produced" }
      - uses: actions/upload-artifact@v4
        with:
          name: Clippy-win-x64
          path: artifacts/Clippy-win-x64/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Use a version like v0.2.0" }
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (!(Test-Path $notes)) { throw "Release notes missing: $notes" }
          Compress-Archive -Path artifacts/Clippy-win-x64 -DestinationPath artifacts/Clippy-win-x64.zip
          gh release create $env:RELEASE_TAG artifacts/Clippy-win-x64.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Clippy LAN $env:RELEASE_TAG" --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publishing failed" }
      - name: Update Scoop bucket after release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $hash = (Get-FileHash artifacts/Clippy-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          git fetch origin $env:DEFAULT_BRANCH
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the bucket branch" }
          git switch --detach "origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw "Could not check out the latest bucket branch" }
          ./scripts/Update-ScoopManifest.ps1 -Version ($env:RELEASE_TAG.Substring(1)) -Sha256 $hash -Repository $env:GITHUB_REPOSITORY
          git diff --quiet -- bucket/clippy.json
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/clippy.json
          git commit -m "chore(scoop): update to $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit the Scoop manifest" }
          git push origin "HEAD:$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw "Release exists, but Scoop bucket update failed. Update bucket/clippy.json manually." }
