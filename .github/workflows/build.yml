name: Build Clippy

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    
    env:
      Solution_Name: Clippy.sln
      Configuration: Debug  # Попробуем Debug - часто в Release могут быть недостающие файлы
      Platform: x64
      TargetPlatformVersion: 10.0.22621.0
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive  # На случай если есть подмодули
      
    - name: Check for Tray folder
      run: |
        Write-Host "Checking repository structure..."
        Get-ChildItem -Path . -Recurse -Directory | Select-Object FullName
        Write-Host "`nChecking for Tray related files..."
        Get-ChildItem -Path . -Recurse -Filter "*Tray*" | Select-Object FullName
    
    - name: Patch App.xaml.cs to remove Tray dependency
      shell: pwsh
      run: |
        $appXamlCs = "Clippy\App.xaml.cs"
        if (Test-Path $appXamlCs) {
          Write-Host "Reading App.xaml.cs..."
          $lines = Get-Content $appXamlCs
          
          Write-Host "Patching App.xaml.cs to remove Tray dependency..."
          $newLines = @()
          $skipBlock = $false
          
          for ($i = 0; $i -lt $lines.Count; $i++) {
            $line = $lines[$i]
            
            # Comment out using Clippy.Tray
            if ($line -match 'using Clippy\.Tray') {
              $newLines += "        // $line  // Patched: Tray not available"
              continue
            }
            
            # Comment out TrayFlyoutWindow declarations and usage
            if ($line -match 'TrayFlyoutWindow') {
              $newLines += "        // $line  // Patched: Tray not available"
              continue
            }
            
            $newLines += $line
          }
          
          Set-Content $appXamlCs -Value $newLines
          Write-Host "✓ Patch applied successfully"
        } else {
          Write-Host "✗ App.xaml.cs not found!"
          exit 1
        }
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64
    
    - name: Restore dependencies
      run: dotnet restore $env:Solution_Name
      continue-on-error: false
    
    # Попробуем собрать только стабильные компоненты
    - name: Build CubeKit.UI
      run: msbuild CubeKit.UI\CubeKit.UI.csproj /t:Restore,Build /p:Configuration=$env:Configuration /p:Platform=$env:Platform /p:AppxPackageSigningEnabled=false
      continue-on-error: false
    
    - name: Build Clippy.Core
      run: msbuild Clippy.Core\Clippy.Core.csproj /t:Restore,Build /p:Configuration=$env:Configuration /p:Platform=$env:Platform /p:AppxPackageSigningEnabled=false
      continue-on-error: false
      
    - name: Build main Clippy project
      run: msbuild Clippy\Clippy.csproj /t:Build /p:Configuration=$env:Configuration /p:Platform=$env:Platform /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=false /p:TargetPlatformVersion=$env:TargetPlatformVersion /p:GenerateAppxPackageOnBuild=false /verbosity:detailed
      continue-on-error: false

    - name: Create package signing certificate
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path Signing | Out-Null
        $password = ConvertTo-SecureString "ClippyActionsTemporaryPassword" -AsPlainText -Force
        $certificate = New-SelfSignedCertificate `
          -Type Custom `
          -Subject "CN=3C7C8FC9-7104-4B33-8730-EE1E929D5D3B" `
          -FriendlyName "Clippy sideload package" `
          -CertStoreLocation "Cert:\CurrentUser\My" `
          -KeyExportPolicy Exportable `
          -KeyUsage DigitalSignature `
          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
          -NotAfter (Get-Date).AddYears(2)
        Export-PfxCertificate -Cert $certificate -FilePath Signing\Clippy.pfx -Password $password | Out-Null
        Export-Certificate -Cert $certificate -FilePath Signing\Clippy.cer | Out-Null
    
    - name: Build MSIX Package
      run: |
        msbuild Clippy\Clippy.csproj /t:Build,Publish /p:Configuration=$env:Configuration /p:Platform=$env:Platform /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never /p:AppxPackageDir="$env:GITHUB_WORKSPACE\AppPackages\" /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile="$env:GITHUB_WORKSPACE\Signing\Clippy.pfx" /p:PackageCertificatePassword=ClippyActionsTemporaryPassword /p:PackageCertificateThumbprint="" /p:GenerateAppxPackageOnBuild=true
      continue-on-error: false

    - name: Create sideload installer
      shell: pwsh
      run: |
        @'
        $ErrorActionPreference = "Stop"
        $signingDirectory = Split-Path -Parent $MyInvocation.MyCommand.Path
        $root = Split-Path -Parent $signingDirectory
        $certificate = Join-Path $signingDirectory "Clippy.cer"
        $package = Get-ChildItem -Path $root -Recurse -Filter "Clippy_*.msix" |
          Where-Object { $_.FullName -notmatch "\\Dependencies\\" } |
          Select-Object -First 1
        if (-not $package) { throw "Clippy MSIX package not found." }

        Import-Certificate -FilePath $certificate -CertStoreLocation "Cert:\CurrentUser\TrustedPeople" | Out-Null
        Get-ChildItem -Path $root -Recurse -Filter "*.msix" |
          Where-Object { $_.FullName -match "\\Dependencies\\" } |
          ForEach-Object { Add-AppxPackage -Path $_.FullName }
        Add-AppxPackage -Path $package.FullName
        Write-Host "Clippy installed successfully."
        '@ | Set-Content -Path Signing\Install.ps1
      
    - name: Upload signed MSIX package
      uses: actions/upload-artifact@v4
      with:
        name: Clippy-MSIX-${{ github.sha }}
        path: |
          AppPackages/**/*.msix
          Signing/Clippy.cer
          Signing/Install.ps1
        if-no-files-found: error
        retention-days: 7
