name: Build Clippy EXE

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Test model connection logic
        run: dotnet run --project tests/Clippy.ConnectionTests -c Release
      - name: Publish portable Windows x64 app
        run: >-
          msbuild Clippy\Clippy.csproj /restore /t:Publish
          /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64
          /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=false
          /p:PublishDir=${{ github.workspace }}\artifacts\Clippy-win-x64\
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/Clippy-win-x64/Clippy.exe)) { throw "Clippy.exe was not produced" }
      - uses: actions/upload-artifact@v4
        with:
          name: Clippy-win-x64
          path: artifacts/Clippy-win-x64/
          if-no-files-found: error
