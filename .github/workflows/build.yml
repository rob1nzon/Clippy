name: Build clean Clippy MSIX

on:
  push:
    branches: [ clean-local-openai ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      Configuration: Release
      Platform: x64

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 6
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Restore
      run: dotnet restore Clippy.sln

    - name: Create signing certificate
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path Signing | Out-Null
        $password = ConvertTo-SecureString "ClippyActionsTemporaryPassword" -AsPlainText -Force
        $certificate = New-SelfSignedCertificate `
          -Type Custom `
          -Subject "CN=3C7C8FC9-7104-4B33-8730-EE1E929D5D3B" `
          -CertStoreLocation "Cert:\CurrentUser\My" `
          -KeyExportPolicy Exportable `
          -KeyUsage DigitalSignature `
          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
          -NotAfter (Get-Date).AddYears(2)
        Export-Certificate -Cert $certificate -FilePath Signing\Clippy.cer | Out-Null
        "CLIPPY_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Build MSIX
      shell: pwsh
      run: |
        msbuild Clippy\Clippy.csproj /t:Build /p:Configuration=$env:Configuration /p:Platform=$env:Platform /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageDir="$env:GITHUB_WORKSPACE\AppPackages\" /p:AppxPackageSigningEnabled=true /p:PackageCertificateThumbprint=$env:CLIPPY_CERT_THUMBPRINT /p:GenerateAppxPackageOnBuild=true

    - name: Validate MSIX signature
      shell: pwsh
      run: |
        $package = Get-ChildItem AppPackages -Recurse -Filter "Clippy_*.msix" |
          Where-Object { $_.FullName -notmatch "\\Dependencies\\" } |
          Select-Object -First 1
        if (-not $package) { throw "Clippy MSIX not found." }
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
        try {
          if (-not ($archive.Entries | Where-Object FullName -eq "AppxSignature.p7x")) {
            throw "Signed MSIX does not contain AppxSignature.p7x."
          }
          $manifestEntry = $archive.Entries | Where-Object FullName -eq "AppxManifest.xml"
          $reader = [System.IO.StreamReader]::new($manifestEntry.Open())
          try { $manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
          if ($manifest -match "<PackageDependency") {
            throw "MSIX still depends on an external Windows App Runtime package."
          }
          if (-not ($archive.Entries | Where-Object FullName -eq "Microsoft.WindowsAppRuntime.dll")) {
            throw "Self-contained Windows App Runtime is missing from MSIX."
          }
        } finally {
          $archive.Dispose()
        }

    - name: Create installer
      shell: pwsh
      run: |
        @'
        $ErrorActionPreference = "Stop"
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = [Security.Principal.WindowsPrincipal]::new($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          Start-Process powershell.exe -Verb RunAs -ArgumentList "-ExecutionPolicy Bypass -File `"$PSCommandPath`""
          exit
        }
        $signingDirectory = Split-Path -Parent $MyInvocation.MyCommand.Path
        $root = Split-Path -Parent $signingDirectory
        Import-Certificate -FilePath (Join-Path $signingDirectory "Clippy.cer") -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" | Out-Null
        Get-ChildItem $root -Recurse -Filter "*.msix" |
          Where-Object { $_.FullName -match "\\Dependencies\\" } |
          ForEach-Object { Add-AppxPackage -Path $_.FullName }
        $package = Get-ChildItem $root -Recurse -Filter "Clippy_*.msix" |
          Where-Object { $_.FullName -notmatch "\\Dependencies\\" } |
          Select-Object -First 1
        Add-AppxPackage -Path $package.FullName -ForceApplicationShutdown
        '@ | Set-Content Signing\Install.ps1

    - name: Upload signed MSIX
      uses: actions/upload-artifact@v4
      with:
        name: Clippy-clean-MSIX-${{ github.sha }}
        path: |
          AppPackages/**/*.msix
          Signing/Clippy.cer
          Signing/Install.ps1
        if-no-files-found: error
        retention-days: 7
